<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaron's Pro PDF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind to use CSS classes for dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { backdrop-filter: blur(16px); }
        .drop-zone--over { border-color: #3b82f6 !important; transform: scale(1.02); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .float-icon { animation: float 3s ease-in-out infinite; }
        .history-item { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        /* Custom scrollbar for history */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-100 dark:from-slate-900 dark:to-slate-800 min-h-screen flex flex-col items-center justify-center p-4 md:p-10 transition-colors duration-500 font-sans">

    <div class="absolute top-6 right-6">
        <button id="themeToggle" class="p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg text-slate-500 dark:text-yellow-400 hover:scale-110 transition-transform focus:outline-none">
            <i class="fas fa-moon dark:hidden text-xl"></i>
            <i class="fas fa-sun hidden dark:block text-xl"></i>
        </button>
    </div>

    <div class="glass bg-white/80 dark:bg-slate-800/80 max-w-2xl w-full rounded-[2rem] shadow-2xl p-8 border border-white/50 dark:border-slate-700 transition-colors duration-500">
        
        <div class="text-center mb-8">
            <div class="inline-block p-4 bg-blue-600 rounded-2xl shadow-lg mb-4 float-icon">
                <i class="fas fa-file-pdf text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight uppercase transition-colors">High-Res Converter</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium italic transition-colors">Vector-quality rendering for Western Med Sci</p>
        </div>

        <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl p-12 text-center transition-all cursor-pointer hover:border-blue-500 dark:hover:border-blue-400 hover:bg-blue-50/50 dark:hover:bg-slate-700/50 group relative">
            <input type="file" id="fileInput" class="hidden" accept=".pptx">
            <div id="uploadContent">
                <i class="fas fa-cloud-arrow-up text-5xl text-slate-300 dark:text-slate-500 group-hover:text-blue-500 dark:group-hover:text-blue-400 mb-4 transition-colors"></i>
                <p id="fileName" class="text-slate-600 dark:text-slate-300 font-semibold text-lg transition-colors">Drop PPTX here or <span class="text-blue-600 dark:text-blue-400 underline">browse</span></p>
                <p class="text-xs text-slate-400 dark:text-slate-500 mt-2 italic transition-colors">Optimized for high-detail diagrams</p>
            </div>
        </div>

        <div id="progressWrapper" class="hidden mt-8 space-y-3">
            <div class="flex justify-between items-end">
                <div class="space-y-1">
                    <span id="statusText" class="text-sm font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">Processing...</span>
                    <p id="subStatus" class="text-xs text-slate-400 dark:text-slate-500 italic">Connecting to conversion engine</p>
                </div>
                <span id="percentText" class="text-lg font-black text-blue-600 dark:text-blue-400">0%</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden transition-colors">
                <div id="progressBar" class="bg-blue-600 dark:bg-blue-500 h-full rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style="width: 0%"></div>
            </div>
        </div>

        <button id="convertBtn" onclick="convert()" class="w-full mt-8 bg-slate-900 dark:bg-blue-600 hover:bg-blue-600 dark:hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-xl transition-all active:scale-95 flex items-center justify-center space-x-3 group">
            <span class="uppercase tracking-widest">Convert to PDF</span>
            <i class="fas fa-bolt group-hover:text-yellow-400 transition-colors"></i>
        </button>

        <div id="historySection" class="hidden mt-10 pt-6 border-t border-slate-200 dark:border-slate-700 transition-colors">
            <h3 class="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-4">Recent Sessions</h3>
            <div id="historyList" class="space-y-2 max-h-32 overflow-y-auto pr-2">
                </div>
        </div>

        <footer class="mt-8 text-center">
            <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] transition-colors">&copy; 2026 Aaron Su • University of Western Ontario</p>
        </footer>
    </div>

    <script>
        // --- Dark Mode Logic ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        // Check local storage for theme preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            if (htmlElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        // --- Core Application Logic ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const historyList = document.getElementById('historyList');
        const historySection = document.getElementById('historySection');

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); };
        dropZone.ondragleave = () => dropZone.classList.remove('drop-zone--over');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileName();
            }
        };

        fileInput.onchange = updateFileName;

        function updateFileName() {
            if (fileInput.files[0]) {
                const name = fileInput.files[0].name;
                fileNameDisplay.innerHTML = `Selected: <span class="text-blue-600 dark:text-blue-400 font-black">${name}</span>`;
            }
        }

        function addToHistory(name) {
            historySection.classList.remove('hidden');
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const item = document.createElement('div');
            item.className = "history-item flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-100 dark:border-slate-600 transition-colors";
            item.innerHTML = `
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i class="fas fa-check-circle text-green-500 dark:text-green-400 flex-shrink-0"></i>
                    <span class="text-sm font-medium text-slate-700 dark:text-slate-200 truncate">${name}</span>
                </div>
                <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase ml-2 flex-shrink-0">${now}</span>
            `;
            historyList.prepend(item);
        }

        async function convert() {
            const file = fileInput.files[0];
            if (!file) return alert("Select a PowerPoint file first!");

            const btn = document.getElementById('convertBtn');
            const wrapper = document.getElementById('progressWrapper');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('statusText');
            const subStatus = document.getElementById('subStatus');
            const percentText = document.getElementById('percentText');

            // UI Reset
            btn.disabled = true;
            btn.classList.add('opacity-50');
            wrapper.classList.remove('hidden');
            
            // Phase 1: Upload
            bar.style.width = '30%';
            percentText.innerText = '30%';
            status.innerText = "Uploading...";
            subStatus.innerText = "Sending file to secure server";
            status.className = "text-sm font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider";
            bar.className = "bg-blue-600 dark:bg-blue-500 h-full rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/api/convert', { method: 'POST', body: formData });
                
                // Phase 2: Processing
                bar.style.width = '75%';
                percentText.innerText = '75%';
                status.innerText = "Rendering...";
                subStatus.innerText = "Applying vector transformation";

                if (response.ok) {
                    const blob = await response.blob();
                    
                    // Critical Fix: Verify we actually got a PDF and not an API error text
                    if (blob.type !== "application/pdf") {
                        throw new Error("Invalid response from engine. File may be too large.");
                    }

                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name.replace(/\.[^/.]+$/, "") + ".pdf"; // Better regex to replace extension
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    // Success UI
                    bar.style.width = '100%';
                    percentText.innerText = '100%';
                    status.innerText = "Success!";
                    status.classList.replace('text-blue-600', 'text-green-600');
                    status.classList.replace('dark:text-blue-400', 'dark:text-green-400');
                    bar.classList.replace('bg-blue-600', 'bg-green-500');
                    bar.classList.replace('dark:bg-blue-500', 'dark:bg-green-500');
                    subStatus.innerText = "File saved to downloads";
                    addToHistory(file.name);
                } else {
                    throw new Error("Engine timeout or server busy.");
                }
            } catch (e) {
                status.innerText = "Error";
                status.classList.replace('text-blue-600', 'text-red-600');
                status.classList.replace('dark:text-blue-400', 'dark:text-red-400');
                subStatus.innerText = e.message;
                bar.classList.replace('bg-blue-600', 'bg-red-500');
                bar.classList.replace('dark:bg-blue-500', 'dark:bg-red-500');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
