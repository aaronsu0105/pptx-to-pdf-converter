<!DOCTYPE html>
<html>
<head>
    <title>Aaron's High-Res Converter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background-color: #f0f2f5; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h2 { color: #1a73e8; margin-bottom: 25px; }
        input[type="file"] { margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; width: 100%; border-radius: 4px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:disabled { background-color: #ccc; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 15px; font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>PPTX to PDF</h2>
        <input type="file" id="fileInput" accept=".pptx">
        <button id="btn" onclick="convert()">Convert to High-Res PDF</button>
        <div class="loader" id="loader"></div>
        <div id="status">Ready to convert</div>
    </div>

    <script>
        async function convert() {
            const input = document.getElementById('fileInput');
            const btn = document.getElementById('btn');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');

            if (!input.files[0]) return alert("Select a file first!");

            // UI Feedback
            btn.disabled = true;
            loader.style.display = "block";
            status.innerText = "Processing high-res rendering...";

            const formData = new FormData();
            formData.append("file", input.files[0]);

            try {
                const response = await fetch('/api/convert', { method: 'POST', body: formData });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    
                    // Get filename from header or fallback
                    const contentDisp = response.headers.get('Content-Disposition');
                    const fileName = contentDisp ? contentDisp.split('filename=')[1].replace(/"/g, '') : "converted.pdf";

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.click();
                    status.innerText = "Conversion Successful!";
                } else {
                    status.innerText = "Server Error. Check file size.";
                }
            } catch (e) {
                status.innerText = "Connection failed.";
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
