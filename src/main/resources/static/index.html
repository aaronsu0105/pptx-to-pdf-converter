<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaron's High-Res PDF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .drop-zone--over { border-color: #3b82f6; background: #eff6ff; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .float-icon { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-6">

    <div class="glass max-w-xl w-full rounded-3xl shadow-2xl p-8 border border-white/50">
        <div class="text-center mb-10">
            <div class="inline-block p-4 bg-blue-600 rounded-2xl shadow-lg mb-4 float-icon">
                <i class="fas fa-file-pdf text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Pro PPTX Converter</h1>
            <p class="text-gray-500 mt-2 font-medium">Vector-quality PDF rendering for Med Sci</p>
        </div>

        <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center transition-all cursor-pointer hover:border-blue-400 hover:bg-blue-50/50 group">
            <input type="file" id="fileInput" class="hidden" accept=".pptx">
            <i class="fas fa-cloud-upload-alt text-5xl text-gray-300 group-hover:text-blue-500 mb-4 transition-colors"></i>
            <p id="fileName" class="text-gray-600 font-medium">Drag & drop your presentation or <span class="text-blue-600">browse</span></p>
            <p class="text-xs text-gray-400 mt-2">Maximum file size: 50MB</p>
        </div>

        <div id="progressWrapper" class="hidden mt-8">
            <div class="flex justify-between mb-2">
                <span id="statusText" class="text-sm font-semibold text-blue-700">Converting...</span>
                <span id="percentText" class="text-sm font-semibold text-blue-700">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <button id="convertBtn" onclick="convert()" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center space-x-2">
            <span>Generate High-Res PDF</span>
            <i class="fas fa-arrow-right"></i>
        </button>

        <footer class="mt-8 text-center text-gray-400 text-sm">
            &copy; 2026 Aaron Su • Western University
        </footer>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');

        // Trigger file input on click
        dropZone.onclick = () => fileInput.click();

        // Handle Drag & Drop
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drop-zone--over'); };
        dropZone.ondragleave = () => dropZone.classList.remove('drop-zone--over');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileName();
            }
        };

        fileInput.onchange = updateFileName;

        function updateFileName() {
            if (fileInput.files[0]) {
                fileNameDisplay.innerHTML = `<span class="text-blue-600 font-bold">${fileInput.files[0].name}</span>`;
            }
        }

        async function convert() {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first!");

            const btn = document.getElementById('convertBtn');
            const wrapper = document.getElementById('progressWrapper');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('statusText');

            // UI Reset
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            wrapper.classList.remove('hidden');
            bar.style.width = '30%';
            status.innerText = "Uploading to server...";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/api/convert', { method: 'POST', body: formData });
                
                bar.style.width = '70%';
                status.innerText = "Rendering Vector PDF...";

                if (response.ok) {
                    const blob = await response.blob();
                    bar.style.width = '100%';
                    status.innerText = "Download complete!";
                    
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name.replace(".pptx", ".pdf");
                    a.click();
                } else {
                    status.innerText = "Conversion failed.";
                    status.classList.add('text-red-500');
                }
            } catch (e) {
                status.innerText = "Network error.";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
